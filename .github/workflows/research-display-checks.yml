name: research-display-checks
on:
  push:
    branches: [main]
    paths:
      - 'dashboard/**'
      - 'research/standards/**'
      - 'research/companies/**/reports/**'
      - 'coverage/cn-a/research_state.jsonl'
      - 'screening/cn-a/value-quality/pool.json'
      - '.github/workflows/research-display-checks.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: research-display-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify-display:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Research state and Python regression
        run: |
          python -m pip install -e '.[dev]'
          python -m pytest -q
          python -m trading_os validate
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: dashboard/package-lock.json
      - name: Verify acceptance bindings
        run: node dashboard/scripts/report-standards.mjs validate
      - name: Install dashboard
        working-directory: dashboard
        run: npm ci --no-audit --no-fund
      - name: Build and tests
        working-directory: dashboard
        run: npm test
      - name: Types and lint
        working-directory: dashboard
        run: |
          npx tsc --noEmit
          npm run lint
      - name: Install browser test tooling (no lockfile changes)
        working-directory: dashboard
        run: |
          npm install --no-save --package-lock=false playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Browser isolation and layout checks
        working-directory: dashboard
        run: node tests/standard-browser.mjs
      - name: Verify source data unchanged
        run: git diff --exit-code -- coverage research screening selection dashboard/package-lock.json
      - name: Test artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: research-display-checks
          path: dashboard/outputs/standard-checks/
          if-no-files-found: ignore
