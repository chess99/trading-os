name: research-display-checks
on:
  push:
    branches: [main]
    paths:
      - 'dashboard/**'
      - 'research/standards/**'
      - 'research/companies/**/reports/**'
      - 'coverage/**/research_state.jsonl'
      - 'coverage/**/research_queue.jsonl'
      - 'research/industries/**'
      - 'research/macro/**'
      - 'research/publications.json'
      - 'src/trading_os/**'
      - 'tests/**'
      - 'screening/**/value-quality/pool.json'
      - '.github/workflows/research-display-checks.yml'
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: research-display-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify-display:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Research state and Python regression
        run: |
          python -m pip install -e '.[dev]'
          python -m pytest -q
          python -m trading_os validate
          python -m trading_os --market hk validate
          python -m trading_os --market us validate
          python -m trading_os quality-pool --market hk validate
          python -m trading_os quality-pool --market us validate
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: dashboard/package-lock.json
      - name: Verify research standard state
        run: node dashboard/scripts/report-standards.mjs validate
      - name: Install dashboard
        working-directory: dashboard
        run: npm ci --no-audit --no-fund
      - name: Build and tests
        working-directory: dashboard
        run: npm test
      - name: Types and lint
        working-directory: dashboard
        run: |
          npx tsc --noEmit
          npm run lint
      - name: Install browser test tooling (no lockfile changes)
        working-directory: dashboard
        run: |
          npm install --prefix "$RUNNER_TEMP/research-browser-tools" --no-save --package-lock=false --ignore-scripts --no-audit --no-fund playwright@1.56.1
          ln -s "$RUNNER_TEMP/research-browser-tools/node_modules/playwright" node_modules/playwright
          "$RUNNER_TEMP/research-browser-tools/node_modules/.bin/playwright" install --with-deps chromium
      - name: Browser isolation and layout checks
        working-directory: dashboard
        run: node tests/standard-browser.mjs
      - name: Verify source data unchanged
        run: git diff --exit-code -- coverage research screening dashboard/package-lock.json
      - name: Test artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: research-display-checks
          path: dashboard/outputs/standard-checks/
          if-no-files-found: ignore
