name: research-ingest

on:
  push:
    branches: [main]
    paths:
      - 'research/inbox/*.json'
      - '.github/workflows/research-ingest.yml'

permissions:
  contents: write

concurrency:
  group: research-coordinator
  cancel-in-progress: false

jobs:
  apply-results:
    if: ${{ !contains(github.event.head_commit.message, '[research-ingest]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install trading-os
        run: python -m pip install -e .

      - name: Apply queued research results
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=(research/inbox/*.json)
          if [ ${#files[@]} -eq 0 ]; then
            echo 'No research result files to apply.'
            exit 0
          fi
          IFS=$'\n' files=($(printf '%s\n' "${files[@]}" | sort))
          unset IFS
          for f in "${files[@]}"; do
            has_update="$(python - "$f" <<'PY'
          import json
          import sys

          with open(sys.argv[1], encoding='utf-8') as handle:
              payload = json.load(handle)
          print('1' if isinstance(payload, dict) and isinstance(payload.get('update'), dict) else '0')
          PY
            )"

            if [ "$has_update" = '1' ]; then
              echo "Recording refresh invalidation for $f"
              update_output="$(python -m trading_os updates record --input "$f")"
              task_id="$(python - "$update_output" <<'PY'
          import json
          import sys

          payload = json.loads(sys.argv[1])
          task = payload.get('enqueued_task')
          if not isinstance(task, dict) or not task.get('task_id'):
              raise SystemExit('refresh update did not enqueue a research task')
          print(task['task_id'])
          PY
              )"
              echo "Dispatching refresh task $task_id"
              dispatch_output="$(python -m trading_os research next --limit 1 --from-end)"
              dispatched_id="$(python - "$dispatch_output" <<'PY'
          import json
          import sys

          payload = json.loads(sys.argv[1])
          tasks = payload.get('tasks') or []
          if len(tasks) != 1:
              raise SystemExit('refresh dispatch did not return exactly one task')
          print(tasks[0]['task_id'])
          PY
              )"
              if [ "$dispatched_id" != "$task_id" ]; then
                echo "Expected refresh task $task_id, dispatched $dispatched_id" >&2
                exit 1
              fi
              echo "Applying refresh result from $f"
              python -m trading_os research complete --input "$f" --task-id "$task_id"
            else
              echo "Dispatching next baseline task for $f"
              python -m trading_os research next --limit 1
              echo "Applying $f"
              python -m trading_os research complete --input "$f"
            fi
            rm "$f"
          done

      - name: Validate research state
        run: python -m trading_os validate

      - name: Commit coordinator outputs
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'research-coordinator[bot]'
          git config user.email 'research-coordinator[bot]@users.noreply.github.com'
          git add -A coverage/cn-a research/watchlist.jsonl research/companies research/inbox
          if git diff --cached --quiet; then
            echo 'No coordinator changes to commit.'
            exit 0
          fi
          git commit -m 'research: apply baseline result [research-ingest]'
          git pull --rebase origin main
          git push origin HEAD:main
