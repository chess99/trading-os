name: research-ingest

on:
  push:
    branches: [main]
    paths:
      - 'research/inbox/*.json'
      - '.github/workflows/research-ingest.yml'

permissions:
  contents: write

concurrency:
  group: research-coordinator
  cancel-in-progress: false

jobs:
  apply-results:
    if: ${{ !contains(github.event.head_commit.message, '[research-ingest]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install trading-os
        run: python -m pip install -e .

      - name: Apply queued research results
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=(research/inbox/*.json)
          if [ ${#files[@]} -eq 0 ]; then
            echo 'No research result files to apply.'
            exit 0
          fi
          IFS=$'\n' files=($(printf '%s\n' "${files[@]}" | sort))
          unset IFS
          for f in "${files[@]}"; do
            task_id="$(python - "$f" <<'PY'
          import json
          import sys

          with open(sys.argv[1], encoding='utf-8') as handle:
              payload = json.load(handle)
          if not isinstance(payload, dict) or not payload.get('task_id'):
              raise SystemExit('periodic result must include task_id')
          print(payload['task_id'])
          PY
            )"
            echo "Starting periodic task $task_id"
            python -m trading_os research start "$task_id"
            echo "Applying $f"
            python -m trading_os research complete --input "$f" --task-id "$task_id"
            rm "$f"
          done

      - name: Validate research state
        run: python -m trading_os validate

      - name: Commit coordinator outputs
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'research-coordinator[bot]'
          git config user.email 'research-coordinator[bot]@users.noreply.github.com'
          git add -A coverage/cn-a research/companies research/inbox
          if git diff --cached --quiet; then
            echo 'No coordinator changes to commit.'
            exit 0
          fi
          git commit -m 'research: apply period result [research-ingest]'
          git pull --rebase origin main
          git push origin HEAD:main
